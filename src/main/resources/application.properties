# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/RetailOrderManagementSystem?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sajid@9897
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Apache Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=retail-order-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.ack-mode=RECORD

# Kafka Topic Names
kafka.topic.retail-order-events=retail-order-events
kafka.topic.mobile-otp-events=mobile-otp-events
kafka.topic.email-otp-events=email-otp-events
kafka.topic.verification-events=verification-events
kafka.topic.notification-events=notification-events

# SMTP Email Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:noreply@retailhub.com}
spring.mail.password=${SMTP_PASSWORD:your-smtp-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SMS Provider Credentials (Twilio / MSG91)
sms.provider.name=${SMS_PROVIDER_NAME:twilio}
sms.provider.account-sid=${TWILIO_ACCOUNT_SID:AC_MOCK_ACCOUNT_SID}
sms.provider.auth-token=${TWILIO_AUTH_TOKEN:mock_auth_token}
sms.provider.from-number=${TWILIO_FROM_NUMBER:+15550000000}

# Aadhaar Provider Configuration (UIDAI Compliant Integration)
aadhaar.provider.enabled=${AADHAAR_PROVIDER_ENABLED:false}
aadhaar.provider.base-url=${AADHAAR_PROVIDER_BASE_URL:https://api.sandbox.uidai-partner.com}
aadhaar.provider.api-key=${AADHAAR_PROVIDER_API_KEY:mock_aadhaar_api_key}
aadhaar.provider.client-id=${AADHAAR_PROVIDER_CLIENT_ID:mock_client_id}

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f9e2c6d8b0a4f7c1e3a5b9c2d8e4f1a6b0c3d7e9f2a4b8c1d}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.kafka=INFO
logging.level.com.bank.retailordermanagementsystem=DEBUG
